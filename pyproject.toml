[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "juniper-mist-mcp"
version = "0.1.0"
description = "MCP server for Juniper Mist network infrastructure APIs"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Nathaniel Roberts" }
]
keywords = ["mcp", "juniper", "mist", "networking", "api"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
    "mcp>=2.0.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
juniper-mist-mcp = "juniper_mist_mcp:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "anyio>=4.0",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
# Defaults (pyflakes + a pycodestyle subset); E501 line length not enforced
select = ["E4", "E7", "E9", "F"]

[tool.hatch.build.targets.wheel]
packages = ["src/juniper_mist_mcp"]

[tool.hatch.build.targets.sdist]
include = [
    "src/juniper_mist_mcp/**/*.py",
    "pyproject.toml",
    "README.md",
]
